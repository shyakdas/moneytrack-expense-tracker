name: Build • Signed Release APK (Main)

on:
  push:
    branches:
      - main

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.toml') }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 🔐 Decode keystore from secrets
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # 🔍 Verify keystore (PKCS12)  ← ADD HERE
      - name: Verify keystore (PKCS12)
        run: |
          ls -lh release.keystore
          keytool -list \
            -keystore release.keystore \
            -storetype PKCS12 \
            -storepass ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      # 🚀 Build SIGNED release APK
      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -x test -x connectedAndroidTest

      # 📦 Upload APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: moneytrack-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
