name: PR • Code Quality & Tests

on:
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Lint • Static Analysis • Tests
    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.toml') }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 🔍 Kotlin Style
      - name: Ktlint
        run: ./gradlew ktlintCheck

      # 🧠 Static Code Analysis
      - name: Detekt
        run: ./gradlew detekt

      # 🧪 Unit Tests
      - name: Unit Tests
        run: ./gradlew testDebugUnitTest

      # 📸 Snapshot Tests (Paparazzi)
      - name: Snapshot Tests
        run: ./gradlew verifyPaparazziDebug

      # 📱 UI Smoke Tests
      - name: UI Tests
        run: ./gradlew connectedDebugAndroidTest
