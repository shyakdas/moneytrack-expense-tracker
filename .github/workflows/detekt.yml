style:
  ForbiddenPattern:
    active: true
    patterns:
      # ❌ Direct dp usage
      - '\b\d+\.dp\b'
      - '\bdp\b'

      # ❌ Raw Color usage
      - 'Color\('
      - 'Color\.'

      # ❌ MaterialTheme usage
      - 'MaterialTheme\.colorScheme'
      - 'MaterialTheme\.typography'

    excludes:
      - '**/ui/theme/**'
      - '**/ui/theme/**/*'

    message: >
      ❌ Do not use raw dp, Color, or MaterialTheme directly.
      Use Dimens, AppTheme.colors, and AppTheme.typography instead.
