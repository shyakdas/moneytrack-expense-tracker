name: PR • Title & Description Rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-rules:
    name: Validate PR title & description
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title (semantic)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            test
            docs
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            PR title must start with a lowercase letter and be descriptive.
          wip: false

      - name: Check PR description is not empty
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body;
            if (!body || body.trim().length < 20) {
              core.setFailed(
                "PR description is required and should explain WHAT and WHY (min 20 characters)."
              );
            }
